[package]
name = "blacknode-skills"
version = "0.3.1"
description = "Reusable task-level robot skills composed from stable Blacknode capabilities."
requires-blacknode = ">=0.3.0"
layer = "skills"
component-mode = true

[categories]
"Skills" = "#eab308"

[components.pick-place]
description = "Capability-driven pick and place skill."
default = false
capabilities = ["skill.pick-place"]

[components.follow]
description = "Capability-driven visual and robot following skills."
default = false
capabilities = ["skill.follow"]
nodes = ["components/follow/nodes"]

[components.follow.dependencies]
requires = [
  { package = "blacknode-ros2", component = "core", version = ">=0.5.6,<1.0.0" },
]

[components.follow.adapters.ros2]
description = "Visual-follow and leader/follower node implementations and composition templates over ROS 2 transports."
default = false
capabilities = ["adapter.skill.follow.ros2"]
nodes = ["components/follow/adapters/ros2/nodes"]
templates = ["components/follow/adapters/ros2/templates"]
node-types = [
  "RobotFollow", "ROS2FollowDetectionJoint", "ROS2LeaderFollower",
  "ROS2PublishJointState", "ROS2SubscribeJointState", "ROS2JointController",
  "ROS2NativeFollowDetectionJoint"
]

[components.follow.adapters.ros2.dependencies]
requires = [
  { package = "blacknode-robot", component = "core", version = ">=0.3.5,<1.0.0" },
  { package = "blacknode-ros2", component = "core", version = ">=0.5.6,<1.0.0" },
]

[components.delivery]
description = "Package and item delivery mission skill."
default = false
capabilities = ["skill.delivery"]

[components.docking]
description = "Robot docking and charging skill."
default = false
capabilities = ["skill.docking"]

[components.inspection]
description = "Structured inspection mission skill."
default = false
capabilities = ["skill.inspection"]
